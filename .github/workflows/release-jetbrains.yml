name: Release (JetBrains)

# Publishes the JetBrains plugin to the JetBrains Marketplace when a tag like
# `jb-v0.1.0` is pushed. Kept separate from the VS Code release so the two can
# version independently.
#
# Required repo secrets:
#   JETBRAINS_MARKETPLACE_TOKEN — Marketplace permanent token (hub token)
#   CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD — plugin signing
#   (see https://plugins.jetbrains.com/docs/intellij/plugin-signing.html)
on:
  push:
    tags:
      - "jb-v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build the shared web bundle
        run: |
          npm ci
          npm run build:webview

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build, sign & publish plugin
        working-directory: packages/jetbrains
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: gradle publishPlugin --no-configuration-cache
